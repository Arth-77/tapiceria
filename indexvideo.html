<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pack Profesional de Limpieza de Tapicerías | Manuales JARBO</title>
<meta name="description" content="Aprende el oficio profesional de limpieza de tapicerías desde cero, con criterio técnico: equipos, telas, química, procesos y seguridad, paso a paso.">
<!-- FAVICON: reemplaza "favicon.png" por la ruta o URL de tu logo/ícono (ideal 512x512px, fondo transparente o sólido) -->
<link rel="icon" type="image/png" href="fotos/fotosfavicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>#hero-boton{
    display:flex;
    margin:0 auto;
    width:fit-content;
}
/* ===================================================================
   SISTEMA VISUAL — variables de diseño. Si algún día quieres cambiar
   un color o una fuente en TODA la página, hazlo aquí, una sola vez.
   Paleta pensada para transmitir "limpieza profesional": blancos,
   grises muy claros y un azul-verdoso (teal) como único acento.
   =================================================================== */
:root{
  --blanco:#FFFFFF;
  --gris-claro:#F3F6F7;
  --gris-medio:#E4EAEC;
  --oscuro:#0E2A32;      /* texto principal, casi negro azulado */
  --gris-texto:#516670;  /* texto secundario */
  --teal:#0C8C8C;        /* único acento: botones, checks, precio, CTA */
  --teal-oscuro:#075E5E;
  --teal-suave:rgba(12,140,140,.08);
  --rojo:#C0392B;        /* solo para urgencia o precio anterior */
  --borde:rgba(14,42,50,0.10);
  --radius:20px;
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--blanco);color:var(--oscuro);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;display:block;}
.display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin:0;font-weight:400;color:var(--oscuro);}
p{margin:0;}
.container{max-width:980px;margin:0 auto;padding:0 1.25rem;}
section{padding:3.6rem 0;}
@media(min-width:768px){section{padding:5.5rem 0;}}
.texto-sec{color:var(--gris-texto);font-size:1.02rem;line-height:1.65;max-width:560px;}
.centro{text-align:center;margin-left:auto;margin-right:auto;}
.teal{color:var(--teal);}
.rojo{color:var(--rojo);}

/* tarjeta — reutilizada en toda la página */
.glass{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radius);box-shadow:0 16px 40px -26px rgba(14,42,50,.28);}

/* botón CTA — el link real se inyecta desde ENLACES.hotmart */
.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;border:none;cursor:pointer;border-radius:14px;padding:1.05rem 1.9rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:transform .3s var(--ease), filter .3s var(--ease);text-decoration:none;}
.btn-cta{background:var(--teal);color:#FFFFFF;box-shadow:0 12px 30px -12px rgba(12,140,140,.55);}
.btn-cta:hover{transform:scale(1.025);filter:brightness(1.07);}
.btn-cta:active{transform:scale(.98);}
.btn-block{width:100%;}

/* aparición al hacer scroll */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease), transform .7s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none;}}

/* nota de transferencia — aparece igual en 3 secciones, viene de un solo texto */
.nota-transferencia{margin-top:1.4rem;padding:1rem 1.2rem;border-radius:14px;border:1px solid var(--borde);background:var(--gris-claro);color:var(--gris-texto);font-size:.85rem;line-height:1.55;max-width:520px;}
.nota-transferencia b{color:var(--oscuro);}

/* ---------- HERO ---------- */
.hero-wrap{position:relative;background:linear-gradient(180deg,#EAF6F6 0%,#FFFFFF 78%);overflow:hidden;}
.hero{padding-top:1.2rem;padding-bottom:2.2rem;text-align:center;position:relative;z-index:2;}
.hero .display{font-size:2.3rem;max-width:740px;margin:1.4rem auto 1rem;}
@media(min-width:768px){.hero .display{font-size:3.9rem;}}
.hero .sub{margin:0 auto 1.6rem;max-width:560px;color:var(--gris-texto);font-size:1.02rem;line-height:1.6;}

/* ---------- BANNER DE OFERTA (arriba de toda la página) ---------- */
.banner-promo{
  width:100%;
  background:linear-gradient(90deg,#14b814 0%,#1fd01f 50%,#12b312 100%);
  color:#fff;
  text-shadow:
  0 1px 1px rgba(0,0,0,.35),
  0 2px 8px rgba(0,0,0,.25);
  text-align:center;
  padding:.7rem 1rem;
  font-weight:700;
  position:relative;
  overflow:hidden;
}

/* Flamas */
.banner-promo::before,
.banner-promo::after{
  content:"🔥";
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  animation:fuego 1.8s ease-in-out infinite;
}

.banner-promo::before{ left:18px; }
.banner-promo::after{
  right:18px;
  animation-delay:.9s;
}

@keyframes fuego{
  0%,100%{
    transform:translateY(-50%) scale(1);
    filter:drop-shadow(0 0 0px #ffae00);
  }
  50%{
    transform:translateY(-58%) scale(1.18);
    filter:drop-shadow(0 0 8px #ff9800);
  }
}
.banner-promo .icono-burbuja{width:16px;height:16px;flex-shrink:0;position:relative;}
.banner-promo .icono-burbuja::before,.banner-promo .icono-burbuja::after{
  content:'';position:absolute;border-radius:50%;border:1.6px solid #fff;
}
.banner-promo .icono-burbuja::before{width:16px;height:16px;top:0;left:0;}
.banner-promo .icono-burbuja::after{width:6px;height:6px;background:#fff;top:-3px;right:-4px;}
.banner-promo strong{font-weight:800;}
.banner-promo .brillo{position:absolute;top:0;left:-30%;width:22%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:brillar 4.5s ease-in-out infinite;}
@keyframes brillar{0%{left:-30%;}55%{left:120%;}100%{left:120%;}}
@media(prefers-reduced-motion:reduce){.banner-promo .brillo{display:none;}}
@media(max-width:480px){.banner-promo{font-size:.72rem;padding:.6rem .8rem;}}

/* burbujas decorativas del hero — puro detalle visual, sin contenido */
.burbuja{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%, rgba(12,140,140,.22), rgba(12,140,140,.04) 70%);pointer-events:none;z-index:1;}
.burbuja-1{width:220px;height:220px;top:-60px;left:-70px;}
.burbuja-2{width:160px;height:160px;top:40%;right:-60px;}
.burbuja-3{width:90px;height:90px;top:14%;right:12%;background:radial-gradient(circle at 32% 28%, rgba(12,140,140,.18), rgba(12,140,140,.02) 70%);}
@media(prefers-reduced-motion:no-preference){
  .burbuja{animation:flotar 9s ease-in-out infinite;}
  .burbuja-2{animation-duration:11s;animation-delay:.6s;}
  .burbuja-3{animation-duration:7.5s;animation-delay:1.2s;}
}
@keyframes flotar{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}

/* ola decorativa al pie del hero */
.ola{display:block;width:100%;height:auto;position:relative;z-index:2;margin-top:-1px;}

.video-box{
    width:100%;
    max-width:420px;
    margin:0 auto 1.8rem;
    border:1px solid var(--borde);
    border-radius:24px;
    overflow:hidden;
    background:var(--oscuro);
    aspect-ratio:9/16;
    position:relative;
    box-shadow:0 20px 46px -22px rgba(14,42,50,.35);
}
.video-box video, .video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;}
.video-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;color:#CFE3E3;font-size:.85rem;background:linear-gradient(160deg,#123B3B,#0E2A32);}
.video-placeholder .play{width:56px;height:56px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;}
.precio-mini{display:flex;align-items:baseline;justify-content:center;gap:.7rem;margin-bottom:1.4rem;}
.precio-mini .actual{font-family:'Bebas Neue',sans-serif;font-size:2.1rem;color:var(--teal);}
.precio-mini .anterior{color:var(--rojo);text-decoration:line-through;font-size:1.05rem;}
.micro-benef{color:var(--gris-texto);font-size:.85rem;margin-top:1.2rem;}

/* ---------- RESULTADO (antes/después) — sección propia, justo tras el hero ---------- */
.sello{
  position:absolute;
  top:-16px;
  right:-14px;
  width:88px;
  height:88px;
  border-radius:50%;
  background:var(--teal);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:.6rem;
  font-weight:700;
  line-height:1.15;
  letter-spacing:.02em;
  transform:rotate(9deg);
  box-shadow:0 12px 26px -10px rgba(12,140,140,.6);
  border:2px dashed rgba(255,255,255,.55);
  padding:.4rem;
  z-index:5;
}
@media(max-width:480px){.sello{width:72px;height:72px;font-size:.52rem;top:-10px;right:-8px;}}

/* comparador antes/después — reutilizable */
.comparador-wrap{position:relative;max-width:560px;margin:2rem auto 0;}
.comparador{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;border:1px solid var(--borde);cursor:ew-resize;user-select:none;touch-action:none;box-shadow:0 16px 40px -26px rgba(14,42,50,.28);}
.comp-despues,.comp-antes{position:absolute;inset:0;background-size:cover;background-position:center;}
.comp-antes{clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0);}
.ph-antes{background:linear-gradient(150deg,#7C6A4A,#9C8A64 45%,#5E5237);}
.ph-despues{background:linear-gradient(150deg,#0C8C8C,#3FB6B6 45%,#EAF9F7 85%);}
.comp-tag{position:absolute;top:.8rem;font-size:.62rem;font-weight:700;letter-spacing:.05em;padding:.3rem .65rem;border-radius:6px;background:rgba(14,42,50,.75);color:#fff;z-index:3;}
.tag-antes{left:.8rem;}
.tag-despues{right:.8rem;background:var(--teal);}
.comp-handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:0;z-index:4;}
.comp-handle::before{content:"";position:absolute;top:0;bottom:0;left:0;width:2px;background:#fff;}
.comp-handle .grip{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}

/* ---------- CARRUSEL DE PÁGINAS (deslice automático) ---------- */
.carrusel-wrap{overflow:hidden;position:relative;margin-top:2.2rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
.carrusel-track{display:flex;gap:1rem;width:max-content;animation:desplazar 30s linear infinite;}
.carrusel-wrap:hover .carrusel-track{animation-play-state:paused;}
@keyframes desplazar{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media(prefers-reduced-motion:reduce){
  .carrusel-track{animation:none;}
  .carrusel-wrap{overflow-x:auto;}
}
.pagina-card{flex:0 0 auto;width:200px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid var(--borde);background:linear-gradient(160deg,#F3F6F7,#E4EAEC);box-shadow:0 14px 30px -20px rgba(14,42,50,.3);position:relative;}
@media(min-width:680px){.pagina-card{width:230px;}}
.pagina-card img{width:100%;height:100%;object-fit:cover;}
.pagina-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;color:var(--gris-texto);font-size:.72rem;text-align:center;padding:1rem;}
.pagina-placeholder .num{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--teal);letter-spacing:.03em;}
.pagina-cta{text-align:center;margin-top:2.4rem;}
.pagina-cta p{font-family:'Inter',sans-serif;font-weight:700;font-size:1.15rem;color:var(--oscuro);max-width:560px;margin:0 auto 1.3rem;line-height:1.4;}

/* ---------- BONOS EXCLUSIVOS ---------- */
.grid-bonos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem;margin-top:2.2rem;}
.bono-card{padding:0;overflow:hidden;position:relative;}
.bono-numero{position:absolute;top:.9rem;left:.9rem;z-index:2;background:rgba(14,42,50,.72);backdrop-filter:blur(3px);color:#fff;font-size:.64rem;font-weight:800;letter-spacing:.06em;padding:.3rem .7rem;border-radius:99px;}
.bono-card .card-body h3{font-family:'Inter',sans-serif;font-weight:700;font-size:.98rem;margin-bottom:.4rem;color:var(--oscuro);}
.bono-card .card-body p{color:var(--gris-texto);font-size:.86rem;line-height:1.55;}

/* ---------- LOGROS (qué vas a aprender) ---------- */
.grid-logros{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.1rem;margin-top:2.2rem;}
.logro{padding:0;overflow:hidden;}

/* ---------- componente reutilizable: cabecera visual con imagen o gradiente + ícono grande ---------- */
/* usado por las tarjetas de "qué vas a aprender" y por los "bonos" */
.card-visual{width:100%;aspect-ratio:16/10;position:relative;overflow:hidden;}
.card-visual img{width:100%;height:100%;object-fit:cover;}
.card-visual .icono-grande{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.card-visual .icono-grande .caja{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.16);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;color:#fff;}
.card-visual .icono-grande .caja svg{width:28px;height:28px;}
.card-body{padding:1.35rem 1.4rem 1.5rem;}
.logro .card-body h3{font-family:'Inter',sans-serif;font-weight:700;font-size:1.02rem;margin-bottom:.45rem;color:var(--oscuro);}
.logro .card-body p{color:var(--gris-texto);font-size:.9rem;line-height:1.55;}

/* ---------- INCLUYE ---------- */
.lista-incluye{list-style:none;margin:2.2rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;max-width:760px;margin-left:auto;margin-right:auto;}
.lista-incluye li{display:flex;gap:.9rem;align-items:flex-start;border:1px solid var(--borde);border-radius:16px;padding:1.1rem 1.2rem;background:#fff;box-shadow:0 12px 26px -20px rgba(14,42,50,.25);text-align:left;}
.lista-incluye .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lista-incluye .ico svg{width:21px;height:21px;}
.lista-incluye .txt b{display:block;font-size:.94rem;margin-bottom:.2rem;color:var(--oscuro);}
.lista-incluye .txt span{color:var(--gris-texto);font-size:.84rem;line-height:1.5;}
.tag-proximamente{display:inline-block;margin-left:.4rem;font-size:.62rem;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:.1rem .5rem;vertical-align:middle;}

/* ---------- DOS MANUALES ---------- */
.grid-manuales{display:grid;gap:1.1rem;margin-top:2.2rem;}
@media(min-width:680px){.grid-manuales{grid-template-columns:1fr 1fr;}}
/* ---------- SISTEMA DE COLORES DE ACENTO (para iconos, tarjetas e imágenes) ---------- */
/* Se usan para dar variedad visual sin perder la paleta profesional. */
:root{
  --c-teal-1:#0C8C8C;   --c-teal-2:#3FB6B6;   --c-teal-t:rgba(12,140,140,.12);
  --c-azul-1:#0B63B0;   --c-azul-2:#4FA3E8;   --c-azul-t:rgba(11,99,176,.12);
  --c-morado-1:#6C3FB5; --c-morado-2:#9B6FE0; --c-morado-t:rgba(108,63,181,.12);
  --c-ambar-1:#B9760F;  --c-ambar-2:#E8A93A;  --c-ambar-t:rgba(185,118,15,.13);
  --c-rosa-1:#C23B6C;   --c-rosa-2:#E86FA0;   --c-rosa-t:rgba(194,59,108,.12);
  --c-verde-1:#1F8A4C;  --c-verde-2:#3FBE73;  --c-verde-t:rgba(31,138,76,.12);
}

/* ---------- BADGE genérico arriba de cualquier título de sección ---------- */
.badge-seccion{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1.1rem;}
.badge-seccion.izq{justify-content:flex-start;}
.badge-seccion .chispas{color:var(--teal);flex-shrink:0;}
.badge-seccion .pill{background:var(--teal);color:#fff;font-family:'Inter',sans-serif;font-weight:800;font-size:.8rem;letter-spacing:.03em;padding:.5rem 1.2rem;border-radius:99px;box-shadow:0 10px 22px -12px rgba(12,140,140,.6);}
.badge-seccion .emoji{font-size:1.3rem;flex-shrink:0;}
@media(max-width:420px){.badge-seccion .pill{font-size:.7rem;padding:.45rem .9rem;}}

/* ---------- decorado especial del título de Testimonios (comillas grandes) ---------- */
.titulo-testimonios{position:relative;display:inline-block;}
.titulo-testimonios .comilla{position:absolute;font-family:Georgia,serif;font-weight:700;font-size:5.5rem;color:var(--teal);opacity:.16;line-height:1;pointer-events:none;user-select:none;}
.titulo-testimonios .comilla.izq{left:-1.6rem;top:-1.6rem;}
.titulo-testimonios .comilla.der{right:-1.6rem;bottom:-2.4rem;transform:rotate(180deg);}
@media(max-width:560px){.titulo-testimonios .comilla{font-size:3.6rem;}.titulo-testimonios .comilla.izq{left:-.8rem;top:-1rem;}.titulo-testimonios .comilla.der{right:-.8rem;bottom:-1.6rem;}}

/* ---------- BADGE "2 MANUALES" arriba del título ---------- */
/* .manuales-badge ahora reutiliza .badge-seccion (ver arriba) */

/* ---------- subrayado tipo "hecho a mano" dentro del título ---------- */
.subrayado{position:relative;display:inline-block;color:var(--teal);}
.subrayado .swash{position:absolute;left:0;bottom:-11px;width:100%;height:14px;color:var(--teal);}

/* ---------- tarjeta de manual: número + portada + tag + footer de destacados ---------- */
.manual-card{padding:1.7rem;}
.manual-top{display:flex;gap:1.1rem;align-items:flex-start;margin-bottom:1.3rem;}
.manual-cover{
  width:100px;flex-shrink:0;aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;
  background:linear-gradient(155deg,var(--oscuro) 0%,var(--teal-oscuro) 100%);
  box-shadow:0 14px 26px -14px rgba(14,42,50,.55);
  display:flex;flex-direction:column;justify-content:space-between;padding:.55rem .55rem;
}
.manual-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.manual-cover .cov-label{font-size:.48rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#8FE0DA;}
.manual-cover .cov-titulo{font-family:'Bebas Neue',sans-serif;font-size:.92rem;line-height:1.08;color:#fff;letter-spacing:.01em;}
.manual-cover .cov-icono{width:22px;height:22px;color:var(--teal);align-self:flex-end;}
.manual-info{flex:1;min-width:0;padding-top:.1rem;}
.manual-info .numero{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--teal);line-height:1;margin-bottom:.35rem;}
.manual-info .tag{display:inline-block;background:var(--teal-suave);color:var(--teal-oscuro);font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.28rem .65rem;border-radius:99px;margin-bottom:.55rem;}
.manual-card h3{font-family:'Inter',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:.5rem;color:var(--oscuro);line-height:1.3;}
.manual-card p{color:var(--gris-texto);font-size:.88rem;line-height:1.55;}
.manual-divisor{height:1px;background:var(--borde);margin:1.3rem 0 1.1rem;}
.manual-footer{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
.manual-foot-item{display:flex;align-items:center;gap:.5rem;}
.manual-foot-item .ico{width:34px;height:34px;border-radius:9px;background:var(--teal-suave);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.manual-foot-item .ico svg{width:17px;height:17px;}
.manual-foot-item span{font-size:.72rem;font-weight:700;color:var(--oscuro);line-height:1.25;}
@media(max-width:420px){
  .manual-footer{grid-template-columns:1fr;gap:.55rem;}
}

/* ---------- SOBRE MI ---------- */
.sobremi{display:grid;gap:1.6rem;align-items:center;}
@media(min-width:680px){.sobremi{grid-template-columns:1fr 1fr;}}
.sobremi-fotos{display:grid;grid-template-columns:1.3fr 1fr;gap:.7rem;}
.foto-box{border-radius:18px;overflow:hidden;border:1px solid var(--borde);aspect-ratio:3/4;background:linear-gradient(150deg,#F3F6F7,#E4EAEC);position:relative;}
.foto-box img{width:100%;height:100%;object-fit:cover;}
.foto-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gris-texto);font-size:.72rem;text-align:center;padding:.6rem;}
.sobremi-texto p{color:var(--gris-texto);font-size:.98rem;line-height:1.65;margin-bottom:.7rem;}

/* ---------- TESTIMONIOS ---------- */
.grid-test{display:grid;gap:1.1rem;margin-top:2.4rem;}
@media(min-width:680px){.grid-test{grid-template-columns:1fr 1fr;}}
.test-card{padding:1.4rem;}
.test-card p.quote{color:var(--gris-texto);font-size:.9rem;line-height:1.55;margin-bottom:.9rem;}
.test-card .autor{font-size:.85rem;font-weight:700;color:var(--oscuro);}
.test-card .autor span{color:var(--gris-texto);font-weight:400;font-size:.78rem;}

/* --- variante "clasica": avatar de iniciales + comilla grande de fondo --- */
.test-clasica{position:relative;overflow:hidden;}
.test-clasica .comilla-fondo{position:absolute;top:-.6rem;right:.4rem;font-family:Georgia,serif;font-size:4.5rem;font-weight:700;color:var(--gris-medio);line-height:1;user-select:none;}
.test-clasica .fila-autor{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;position:relative;z-index:1;}
.test-clasica .avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:.85rem;color:#fff;flex-shrink:0;}
.test-clasica p.quote{position:relative;z-index:1;}

/* --- variante "whatsapp": burbuja de chat con acento verde --- */
.test-whatsapp{background:#EAFBF3;border-color:rgba(37,211,102,.28);border-radius:20px 20px 20px 4px;position:relative;}
.test-whatsapp .encabezado{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;}
.test-whatsapp .encabezado .ico-wa{width:26px;height:26px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;flex-shrink:0;}
.test-whatsapp .encabezado span{font-size:.7rem;font-weight:700;color:#1a9c56;letter-spacing:.02em;}

/* --- variante "estrellas": calificación de 5 estrellas arriba --- */
.test-estrellas .estrellas{display:flex;gap:.2rem;margin-bottom:.8rem;color:var(--ambar,#E8A93A);}
.test-estrellas .estrellas svg{width:16px;height:16px;fill:#E8A93A;stroke:none;}

/* --- variante "destacada": borde de color + insignia de verificado --- */
.test-destacada{border-left:5px solid var(--teal);position:relative;}
.test-destacada .verificado{position:absolute;top:1.1rem;right:1.1rem;display:flex;align-items:center;gap:.3rem;background:var(--teal-suave);color:var(--teal-oscuro);font-size:.62rem;font-weight:800;padding:.25rem .55rem;border-radius:99px;}
.test-destacada .verificado svg{width:11px;height:11px;}
.test-destacada p.quote{font-size:.95rem;font-weight:500;color:var(--oscuro);}

/* ---------- PRECIO ---------- */
.precio-card{max-width:440px;margin:2.2rem auto 0;padding:2.2rem 1.8rem;text-align:center;}
.precio-card .anterior{color:var(--rojo);text-decoration:line-through;font-size:1.15rem;}
.precio-card .actual{font-family:'Bebas Neue',sans-serif;font-size:3.4rem;color:var(--teal);margin:.2rem 0 .3rem;}
.precio-card .usd{color:var(--gris-texto);font-size:.95rem;margin-bottom:.3rem;}
.precio-card .nota-moneda{color:var(--gris-texto);font-size:.78rem;margin-bottom:1.4rem;}
.precio-card .garantia{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1.4rem 0;color:var(--gris-texto);font-size:.85rem;}
.precio-card .garantia b{color:var(--teal);}

/* ---------- FAQ ---------- */
.faq-item{border-bottom:1px solid var(--borde);}
.faq-q{cursor:pointer;padding:1.2rem .2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
.faq-q h3{font-family:'Inter',sans-serif;font-weight:600;font-size:.96rem;color:var(--oscuro);}
.faq-q .mas{color:var(--teal);font-size:1.3rem;transition:transform .3s var(--ease);flex-shrink:0;}
.faq-item.open .faq-q .mas{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s var(--ease);}
.faq-a p{color:var(--gris-texto);font-size:.9rem;line-height:1.6;padding:0 .2rem .4rem;}

/* ---------- STICKY CTA ---------- */
.sticky-cta{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:55;opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .35s var(--ease), transform .35s var(--ease);padding-bottom:env(safe-area-inset-bottom);}
.sticky-cta.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.sticky-cta .btn{width:100%;font-size:1.02rem;padding:1.05rem;box-shadow:0 12px 34px -12px rgba(12,140,140,.6);}

/* ---------- WHATSAPP FLOTANTE ---------- */
.btn-whatsapp{position:fixed;right:1.1rem;bottom:5.6rem;z-index:56;width:52px;height:52px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:1.5rem;text-decoration:none;box-shadow:0 8px 24px -6px rgba(14,42,50,.35);}

/* ---------- FOOTER ---------- */
footer{padding:3rem 0 7rem;border-top:1px solid var(--borde);text-align:center;background:var(--gris-claro);}
footer .flogo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:.7rem;text-transform:uppercase;color:var(--oscuro);}
footer p{color:var(--gris-texto);font-size:.74rem;}

  el.style.backgroundPosition = 'center';

function bindFAQ(){
  document.querySelectorAll('[data-faq]').forEach(item=>{
    const head = item.querySelector('.faq-q');
    const body = item.querySelector('.faq-a');
    head.addEventListener('click', ()=>{
      const abierto = item.classList.contains('open');
      document.querySelectorAll('[data-faq]').forEach(o=>{ o.classList.remove('open'); o.querySelector('.faq-a').style.maxHeight = null; });
      if(!abierto){ item.classList.add('open'); body.style.maxHeight = body.scrollHeight + 'px'; }
    });
  });
}

/* ---------- comparador antes/después (arrastrable) ---------- */
function initComparador(){
  document.querySelectorAll('.comparador').forEach(el=>{
    const handle = el.querySelector('.comp-handle');
    function setPos(clientX){
      const r = el.getBoundingClientRect();
      let pct = ((clientX-r.left)/r.width)*100;
      pct = Math.max(0,Math.min(100,pct));
      el.style.setProperty('--pos', pct+'%');
    }
    let arrastrando = false;
    handle.addEventListener('pointerdown', e=>{ arrastrando=true; handle.setPointerCapture(e.pointerId); });
    window.addEventListener('pointerup', ()=> arrastrando=false);
    el.addEventListener('pointermove', e=>{ if(arrastrando) setPos(e.clientX); });
    el.addEventListener('click', e=>{ if(!e.target.closest('.comp-handle')) setPos(e.clientX); });
  });
}

/* ---------- aparición al hacer scroll ---------- */
function initReveal(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

/* ---------- CTA flotante: aparece después del hero ---------- */
function initStickyCTA(){
  const sticky = document.getElementById('sticky-cta');
  const hero = document.getElementById('sec-hero');
  if(!sticky || !hero) return;
  window.addEventListener('scroll', ()=>{
    sticky.classList.toggle('show', hero.getBoundingClientRect().bottom < 0);
  }, {passive:true});
}
